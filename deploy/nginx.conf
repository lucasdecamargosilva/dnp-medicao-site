server {
  listen 80;
  root /usr/share/nginx/html;
  autoindex off;
  gzip on;
  gzip_types application/javascript text/javascript text/css;
  gzip_min_length 1024;

  # página e código sempre revalidados (atualização aparece na hora)
  location = / { add_header Cache-Control "no-cache"; try_files /index.html =404; }
  location /src/ { add_header Cache-Control "no-cache"; }
  # opencv (10 MB) e áudios mudam pouco
  location /vendor/ { add_header Cache-Control "public, max-age=86400"; }
  location /audio/ { add_header Cache-Control "public, max-age=86400"; }
  # diagnóstico só existe no servidor de teste local
  location = /__debug { return 204; }
}
